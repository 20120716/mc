<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TOGETHER — CO-OP PUZZLE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111e;color:#edf7ff;font-family:system-ui}header{padding:12px 18px;background:#10243a;color:#8eeaff;font-weight:bold;display:flex;justify-content:space-between;gap:8px}main{max-width:1100px;margin:16px auto;padding:0 12px;display:grid;grid-template-columns:1fr 270px;gap:12px}.panel{background:#102036;border:1px solid #29445f;border-radius:14px;padding:12px}canvas{width:100%;height:auto;border-radius:10px;touch-action:none}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1;min-width:0}button,select,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #477b9a;background:#183b57;color:white}button{cursor:pointer}.hint{font-size:12px;color:#a9bfd2;line-height:1.6}.controls{display:none;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.controls button{height:48px}.side{display:flex;flex-direction:column;gap:12px}#chatlog{height:170px;overflow:auto;background:#091727;padding:8px;border-radius:8px;font-size:13px}.msg{overflow-wrap:anywhere;margin:5px 0}.dialog{max-width:440px;width:100%;max-height:94vh;overflow:auto;background:#12263e;border:1px solid #416987;border-radius:16px;padding:20px}.dialog h2{color:#8eeaff}#menu{position:fixed;inset:0;background:#06101bee;display:grid;place-items:center;padding:16px;z-index:2}#menu.hide{display:none}label{display:block;margin-top:10px;font-size:13px;color:#b8d4e8}#status{color:#8eeaff;font-size:12px}@media(max-width:760px){main{grid-template-columns:1fr}.controls{display:grid}.side{display:flex}}
/* UI motion */
button,select,input{transition:transform .18s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease}
button:hover{background:#245575;border-color:#8eeaff;box-shadow:0 5px 18px #0004;transform:translateY(-2px)}
button:active{transform:translateY(1px) scale(.98)}
input:focus,select:focus{outline:none;border-color:#8eeaff;box-shadow:0 0 0 3px #8eeaff30}
.panel{animation:panelIn .55s cubic-bezier(.2,.8,.2,1) both}
.side .panel:nth-child(2){animation-delay:.08s}.side .panel:nth-child(3){animation-delay:.16s}
#menu{backdrop-filter:blur(8px);animation:veilIn .3s ease both}
#menu.hide{display:none}
.dialog{box-shadow:0 24px 80px #0009;animation:dialogIn .42s cubic-bezier(.16,1,.3,1) both}
#status{transition:color .2s ease}
#chatlog .msg{animation:messageIn .25s ease both}
.controls button{touch-action:manipulation}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
@keyframes dialogIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes messageIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<header><span>✦ TOGETHER — CO-OP PUZZLE (2–4 PLAYERS)</span><span id="status">未接続</span></header>
<main><section class="panel"><div class="row"><b id="stage">STAGE —</b><span id="goal">ルームに参加しよう</span><button id="back">メニュー</button></div><canvas id="game" width="960" height="540"></canvas>
<div class="controls"><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="jump">ジャンプ</button><button id="swap">交代</button></div>
<p class="hint">PC：P1 A/D/W、P2 ←/→/↑、P3 J/L/I、P4 テンキー4/6/8。オンラインでは自分のプレイヤーだけ操作します。</p></section>
<aside class="side"><section class="panel"><b>遊び方</b><p class="hint">誰かがスイッチを踏むとゲートが開く！全員で出口へ進もう。</p><div id="members" class="hint"></div></section>
<section class="panel"><b>💬 オンラインチャット</b><div id="chatlog">ルームに入るとチャットできます。</div><form id="chatForm" class="row"><input id="chatInput" placeholder="メッセージ..." maxlength="160"><button>送信</button></form></section>
<section class="panel hint">ステージデータ：<code>mnt/人数/s番号.json</code></section></aside></main>
<div id="menu"><div class="dialog"><h2>TOGETHER</h2><p class="hint">オンライン協力プレイ。ルームを作るか、コードで参加しよう！</p>
<label>プレイヤー名</label><input id="playerName" maxlength="16" placeholder="Player">
<div class="row"><div><label>人数</label><select id="count"><option value="2">2人</option><option value="3">3人</option><option value="4">4人</option></select></div><div><label>ステージ</label><select id="stageNo"><option value="1">STAGE 01</option><option value="2">STAGE 02</option></select></div></div>
<label>ルームのパスワード</label><div class="row"><select id="createPasswordMode"><option value="none">パスワードなし</option><option value="password">パスワードあり</option></select><input id="createPassword" type="password" maxlength="32" placeholder="4〜32文字" autocomplete="new-password" disabled></div>
<button id="create" style="width:100%">オンラインルームを作成</button>
<label>参加コード（6文字）</label><div class="row"><input id="roomCode" maxlength="6" placeholder="例：A2BC3D"><button id="join">参加</button></div><label>パスワード（設定されている場合）</label><input id="joinPassword" type="password" maxlength="32" placeholder="パスワード" autocomplete="current-password" style="width:100%">
<hr style="border-color:#29445f;margin:16px 0"><button id="local" style="width:100%">同じ端末で遊ぶ（ローカル）</button>
<p class="hint">Firebase匿名認証を使用します。初回はネット接続が必要です。</p><div id="error" class="hint"></div></div></div>
<script type="module" src="js/game.js"></script></body></html>
