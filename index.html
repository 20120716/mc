<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TOGETHER</title><style>
*{box-sizing:border-box}body{margin:0;background:#08111e;color:#edf7ff;font-family:system-ui}header{padding:12px 18px;background:#10243a;color:#8eeaff;font-weight:bold}main{max-width:1100px;margin:16px auto;padding:0 12px;display:grid;grid-template-columns:1fr 270px;gap:12px}.panel{background:#102036;border:1px solid #29445f;border-radius:14px;padding:12px}canvas{width:100%;height:auto;border-radius:10px;touch-action:none}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}button,select,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #477b9a;background:#183b57;color:white}button{cursor:pointer}.hint{font-size:12px;color:#a9bfd2;line-height:1.6}.controls{display:none;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.controls button{height:48px}#menu{position:fixed;inset:0;background:#06101bee;display:grid;place-items:center;padding:16px;z-index:2}#menu.hide{display:none}.dialog{max-width:420px;width:100%;background:#12263e;border:1px solid #416987;border-radius:16px;padding:20px}.dialog h2{color:#8eeaff}.side{display:flex;flex-direction:column;gap:12px}#chatlog{height:170px;overflow:auto;background:#091727;padding:8px;border-radius:8px;font-size:13px}.msg{overflow-wrap:anywhere}@media(max-width:760px){main{grid-template-columns:1fr}.controls{display:grid}.side{display:flex}}
</style></head><body><header>✦ TOGETHER — CO-OP PUZZLE (2–4 PLAYERS)</header><main><section class="panel"><div class="row"><b id="stage">STAGE —</b><span id="goal">人数とステージを選ぼう</span><button id="back">選択へ</button></div><canvas id="game" width="960" height="540"></canvas><div class="controls"><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="jump">ジャンプ</button><button id="swap">交代</button></div><p class="hint">PC：P1 A/D/W、P2 ←/→/↑、P3 J/L/I、P4 テンキー4/6/8。スマホはボタン＋交代で操作。</p></section><aside class="side"><section class="panel"><b>遊び方</b><p class="hint">誰かがスイッチを踏むとゲートが開く！全員で出口へ進もう。</p><div id="members" class="hint"></div></section><section class="panel"><b>💬 チャット（端末内のみ）</b><div id="chatlog">作戦会議しよう！</div><form id="chatForm" class="row"><input id="chatInput" placeholder="メッセージ..." maxlength="160"><button>送信</button></form></section><section class="panel hint">ステージは <code>mnt/人数/s番号.json</code> に分離。オンライン機能はまだ未接続です。</section></aside></main>
<div id="menu"><div class="dialog"><h2>TOGETHER</h2><p class="hint">プレイ人数とステージを選択！</p><label>人数</label><select id="count"><option>2</option><option>3</option><option>4</option></select><label>ステージ</label><select id="stageNo"><option value="1">STAGE 01</option><option value="2">STAGE 02</option></select><div class="row"><button id="start">ゲームスタート</button></div><p class="hint">同じ端末で遊ぶローカル試作版です。</p></div></div><script src="js/game.js"></script></body></html>
